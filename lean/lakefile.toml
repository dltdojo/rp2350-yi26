name = "yi26"
defaultTargets = ["Rv32", "Pio", "Sha256"]

[[lean_lib]]
name = "Rv32"

# The RP2350's PIO instructions; no Rv32 module imports it.
[[lean_lib]]
name = "Pio"

# SHA-256 for running the model (see Sha256.lean); exp228's proof imports it for its `main`, so it is built by default.
[[lean_lib]]
name = "Sha256"

# The model, compiled, for holding it against things that are not it.
[[lean_exe]]
name = "rv32run"
root = "Run"

# The Tier 2 model, compiled, for holding it against the emulator and the RTL (tools/monitor/privdiff.py).
[[lean_exe]]
name = "privrun"
root = "PrivExec"
