[package]
name = "exp187-the-three-taps-and-the-reset"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "exp187: On-device gesture UV (Triple-Tap) and CTAP2 Authenticator Reset with 10s power-on interlock"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.1"
static_cell = "2.1.1"

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }
cbor = { path = "../../crates/cbor" }
bootsel = { path = "../../crates/bootsel" }

p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh"] }
aes = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]

