[package]
name = "exp143-the-image-that-is-never-bought"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A provisional image: the ROM boots it once, and takes it back unless the image calls explicit_buy — try-before-you-buy, watched"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
# `imagedef-none`: this firmware supplies its OWN IMAGE_DEF — with a VERSION
# item, and (for the B build) the TBYB flag that makes the image provisional.
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "imagedef-none"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }

[features]
default = ["auto-reboot"]


auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
