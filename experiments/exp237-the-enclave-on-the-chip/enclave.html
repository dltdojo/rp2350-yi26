<!doctype html>
<meta charset="utf-8">
<title>exp237 — the enclave on the chip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  exp237-the-enclave-on-the-chip — one file, no dependencies, no build step, no
  server. An appliance, not a tool: it connects to exp237's USB CDC port, streams
  the enclave log, and verifies the micro-monitor and U-mode kernel operations.

  Open it directly from the filesystem — Files app -> "Open with Chrome" on
  Android.

  ---------------------------------------------------------------------------
  IF YOU ARE AN AI AGENT: this page is not how you read the log. `yi26 log
  --json` is. Open it only when the page itself is what you are verifying.
  See ../../AGENTS.md.
  ---------------------------------------------------------------------------
-->
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fff; --dim:#666; --line:#ddd; --ok:#0a7d28; --bad:#c0392b; --acc:#1a5fb4; --card:#f8f9fa; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e6e6; --bg:#161616; --dim:#999; --line:#333; --ok:#4ec26e; --bad:#f07470; --acc:#78aeed; --card:#202020; }
  }
  body { font: 15px/1.55 system-ui, sans-serif; color: var(--fg); background: var(--bg);
         margin: 0 auto; max-width: 44rem; padding: 1.2rem 16px 4rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .2rem; }
  p.sub { color: var(--dim); margin: 0 0 1rem; }
  button { font: inherit; padding: .55rem 1rem; border: 1px solid var(--acc); border-radius: 6px;
           background: var(--acc); color: #fff; cursor: pointer; margin: 0 .3rem .4rem 0; }
  button.ghost { background: transparent; color: var(--acc); }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin: .6rem 0; padding: .6rem .9rem; border-left: 3px solid var(--line); color: var(--dim); }
  #status.ok { border-color: var(--ok); color: var(--fg); }
  #status.bad { border-color: var(--bad); color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin: 1rem 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.8rem; }
  .card .label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .card .val { font-size: 1.1rem; font-weight: 600; margin-top: 0.2rem; font-family: ui-monospace, monospace; }
  .card .val.ok { color: var(--ok); }
  .card .val.bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 13.5px; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  td.mono { font-family: ui-monospace, monospace; }
  #raw { background: color-mix(in srgb, var(--fg) 5%, transparent); padding: .6rem; border-radius: 6px;
         font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.45; white-space: pre-wrap;
         word-break: break-all; height: 9rem; overflow-y: auto; margin-top: 1rem; }
  .badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
</style>

<h1>The enclave on the chip</h1>
<p class="sub">exp237 &middot; micro-monitor &amp; secp256k1 U-mode enclave on RP2350 Pico 2 silicon.<br>
  <small>page build <b id="ver">p2</b></small></p>

<p>
  <button id="connect">Connect</button>
  <button id="stop" class="ghost" disabled>Disconnect</button>
  <button id="copy" class="ghost">Copy</button>
</p>

<div id="status">Not connected.</div>

<div class="grid">
  <div class="card">
    <div class="label">Monitor</div>
    <div class="val" id="val-monitor">—</div>
  </div>
  <div class="card">
    <div class="label">PMP Sandbox</div>
    <div class="val" id="val-pmp">—</div>
  </div>
  <div class="card">
    <div class="label">Enclave Result</div>
    <div class="val" id="val-status">—</div>
  </div>
  <div class="card">
    <div class="label">Secret Scrubbing</div>
    <div class="val" id="val-scrub">—</div>
  </div>
  <div class="card">
    <div class="label">Attacks refused</div>
    <div class="val" id="val-faults">—</div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>Run</th>
      <th>a0 / result</th>
      <th>Minstret</th>
      <th>Cycles</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="ops-body">
    <tr><td colspan="5" style="color:var(--dim);text-align:center;">No operations recorded yet.</td></tr>
  </tbody>
</table>

<div id="raw"></div>

<script>
const FILTERS = [{ vendorId: 0x1209, productId: 0x0001 }];
const SET_CONTROL_LINE_STATE = 0x22;
const SET_LINE_CODING        = 0x20;
const BAUD = 115200;

// BEGIN enclave-check
// ---------------------------------------------------------------------------
// Parses exp237's report and decides it from the numbers, not from the word PASS:
// the firmware prints the whole report again every few seconds, so each ENCLAVE
// line starts a fresh one, and a report is complete only when every line of it has
// arrived and held. A page opened mid-report is incomplete until the next one.
// ---------------------------------------------------------------------------

function enclaveLines() {
  let buf = '';
  return function(chunk) {
    buf += chunk;
    const lines = [];
    let idx;
    while ((idx = buf.indexOf('\n')) !== -1) {
      let line = buf.slice(0, idx);
      if (line.endsWith('\r')) line = line.slice(0, -1);
      buf = buf.slice(idx + 1);
      if (line.length > 0) lines.push(line);
    }
    return lines;
  };
}

function enclaveChecker() {
  // exp229's kernel, in its Lean model; the monitor's counting window adds up to FRAMING_MAX.
  const MODEL = { add: 331, sub: 238, mul: 1903 };
  const FRAMING_MAX = 8;
  const PMPCFG0 = 0x1f, PMPADDR0 = 0x08015fff;
  const FAULTS = { fault_read: 5, fault_write: 7, fault_badcall: 8 };

  let st;
  function fresh() {
    st = { started: false, monitorBytes: 0, monitorWords: 0, pmpOk: false, ops: [],
           scrub: null, faults: {}, status: null, errors: [] };
  }
  fresh();

  const kv = (parts) => {
    const o = {};
    for (const p of parts) { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = p.slice(i + 1); }
    return o;
  };

  return {
    feed(line) {
      const parts = line.split(' ');
      if (parts[0] === 'ENCLAVE') {
        fresh();
        st.started = true;
        const f = kv(parts.slice(1));
        st.monitorBytes = parseInt(f.monitor_bytes, 10) || 0;
        st.monitorWords = parseInt(f.monitor_words, 10) || 0;
        const cfg = parseInt(f.pmpcfg0, 16), addr = parseInt(f.pmpaddr0, 16);
        st.pmpOk = f.pmp === '64k_napot' && cfg === PMPCFG0 && addr === PMPADDR0;
        if (!st.pmpOk) st.errors.push(`PMP readback ${f.pmpcfg0} ${f.pmpaddr0} (${f.pmp}), wanted 0x1f 0x08015fff`);
        return { type: 'boot' };
      }
      if (!st.started) return { type: 'other', line };   // the start of a report was missed
      if (parts[0] === 'OP') {
        const name = parts[1], f = kv(parts.slice(2));
        const rec = { op: name, a0: parseInt(f.a0, 10), instret: parseInt(f.minstret, 10),
                      model: parseInt(f.model, 10), again: parseInt(f.again, 10),
                      cycles: parseInt(f.cycles, 10), ok: f.status === 'OK' };
        st.ops.push(rec);
        if (!(name in MODEL)) st.errors.push(`unknown operation ${name}`);
        else if (rec.model !== MODEL[name]) st.errors.push(`${name} model ${rec.model}, exp229 says ${MODEL[name]}`);
        const framing = rec.instret - MODEL[name];
        if (!(framing >= 0 && framing <= FRAMING_MAX)) st.errors.push(`${name} minstret ${rec.instret}, model ${MODEL[name]} + 0..${FRAMING_MAX}`);
        if (rec.again !== rec.instret) st.errors.push(`${name} minstret ${rec.instret} then ${rec.again}: not repeatable`);
        if (rec.a0 !== 0) st.errors.push(`${name} return a0 expected 0, got ${rec.a0}`);
        if (!rec.ok) st.errors.push(`${name} status failed`);
        return { type: 'op', ...rec };
      }
      if (parts[0] === 'TEST') {
        const name = parts[1], f = kv(parts.slice(2));
        const t = { name, mcause: parseInt(f.mcause, 10), a0: f.a0 !== undefined ? parseInt(f.a0, 10) : null,
                    exit: f.exit, callerNonzero: parseInt(f.caller_saved_nonzero, 10),
                    calleeBad: parseInt(f.callee_saved_bad, 10), intact: f.monitor_intact === 'yes',
                    ok: f.status === 'OK' };
        let bad = !t.ok || t.callerNonzero !== 0 || t.calleeBad !== 0;
        if (name === 'scrub') { st.scrub = t; bad = bad || t.exit !== '0x5a'; }
        else if (name in FAULTS) { st.faults[name] = t; bad = bad || t.mcause !== FAULTS[name] || t.a0 !== 1 || !t.intact; }
        else { st.errors.push(`unknown test ${name}`); return { type: 'other', line }; }
        if (bad) st.errors.push(`${name} did not hold: ${line}`);
        return { type: 'test', ...t };
      }
      if (parts[0] === 'STATUS') {
        st.status = parts[1];
        return { type: 'status', status: st.status };
      }
      return { type: 'other', line };
    },
    summary() {
      const allOpsOk = st.ops.length === 3 && st.ops.every(o => o.ok);
      const scrubbed = !!st.scrub && st.scrub.ok && st.scrub.callerNonzero === 0 && st.scrub.calleeBad === 0;
      const faultsHeld = Object.keys(FAULTS).every(n => st.faults[n] && st.faults[n].ok);
      const pass = st.status === 'PASS';
      // The firmware's verdict is read, but never taken without the numbers behind it.
      const isComplete = st.started && st.pmpOk && allOpsOk && scrubbed && faultsHeld && pass && st.errors.length === 0;
      return {
        bootOk: st.started, pmpOk: st.pmpOk, monitorBytes: st.monitorBytes, monitorWords: st.monitorWords,
        ops: st.ops, scrub: st.scrub, faults: st.faults, pass, status: st.status,
        secretsScrubbed: scrubbed, faultsHeld, errors: st.errors, isComplete
      };
    }
  };
}
// END enclave-check

function findCdc(dev) {
  const cfg = dev.configurations[0];
  let control = null, data = null, endpointIn = null;
  for (const iface of cfg.interfaces) {
    const alt = iface.alternates[0];
    if (alt.interfaceClass === 0x02 && control === null) control = iface.interfaceNumber;
    if (alt.interfaceClass === 0x0a && data === null) {
      data = iface.interfaceNumber;
      const ep = alt.endpoints.find((e) => e.direction === 'in' && e.type === 'bulk');
      if (ep) endpointIn = ep.endpointNumber;
    }
  }
  return { control, data, endpointIn };
}

let device = null, running = false, logText = '';
const checker = enclaveChecker();
const splitLines = enclaveLines();

const statusEl = document.getElementById('status');
const valMonitor = document.getElementById('val-monitor');
const valPmp = document.getElementById('val-pmp');
const valStatus = document.getElementById('val-status');
const valScrub = document.getElementById('val-scrub');
const valFaults = document.getElementById('val-faults');
const opsBody = document.getElementById('ops-body');
const rawEl = document.getElementById('raw');
const btnConnect = document.getElementById('connect');
const btnStop = document.getElementById('stop');
const btnCopy = document.getElementById('copy');

function updateUI() {
  const s = checker.summary();
  if (s.bootOk) {
    valMonitor.textContent = `${s.monitorBytes} B / ${s.monitorWords} words`;
    valMonitor.className = 'val';
    valPmp.textContent = s.pmpOk ? '64 KiB NAPOT, read back' : 'BAD readback';
    valPmp.className = s.pmpOk ? 'val ok' : 'val bad';
  }
  if (s.status) {
    valStatus.textContent = s.isComplete ? 'PASS' : 'FAIL';
    valStatus.className = s.isComplete ? 'val ok' : 'val bad';
    valScrub.textContent = s.secretsScrubbed ? 'registers zero' : 'NOT SCRUBBED';
    valScrub.className = s.secretsScrubbed ? 'val ok' : 'val bad';
    const held = Object.values(s.faults).filter(t => t.ok).length;
    valFaults.textContent = `${held} of 3`;
    valFaults.className = s.faultsHeld ? 'val ok' : 'val bad';
  } else if (s.errors.length > 0) {
    valStatus.textContent = 'FAIL';
    valStatus.className = 'val bad';
  }

  if (s.ops.length > 0 || s.scrub || Object.keys(s.faults).length > 0) {
    opsBody.innerHTML = '';
    const row = (name, a0, minstret, cycles, ok) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${name}</td>
        <td class="mono">${a0}</td>
        <td class="mono">${minstret}</td>
        <td class="mono">${cycles}</td>
        <td><span class="badge ${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'}</span></td>
      `;
      opsBody.appendChild(tr);
    };
    for (const op of s.ops) row(`secp256k1_${op.op}`, op.a0, op.instret, op.cycles, op.ok);
    if (s.scrub) row('scrub (canary)', s.scrub.exit, '—', '—', s.secretsScrubbed);
    for (const [n, t] of Object.entries(s.faults)) row(n, `mcause ${t.mcause}`, '—', '—', t.ok);
  }
}

async function start(dev) {
  device = dev;
  await device.open();
  if (device.configuration === null) await device.selectConfiguration(1);

  const cdc = findCdc(device);
  if (cdc.control === null || cdc.data === null || cdc.endpointIn === null) {
    throw new Error('Device does not present CDC ACM interfaces');
  }

  await device.claimInterface(cdc.control);
  await device.claimInterface(cdc.data);

  const lineCoding = new Uint8Array([
    (BAUD) & 0xff, (BAUD >> 8) & 0xff, (BAUD >> 16) & 0xff, (BAUD >> 24) & 0xff,
    0, 0, 8
  ]);
  await device.controlTransferOut({
    requestType: 'class', recipient: 'interface',
    request: SET_LINE_CODING, value: 0, index: cdc.control
  }, lineCoding);

  await device.controlTransferOut({
    requestType: 'class', recipient: 'interface',
    request: SET_CONTROL_LINE_STATE, value: 0x01, index: cdc.control
  });

  statusEl.textContent = 'Connected. Streaming enclave output…';
  statusEl.className = 'ok';
  btnConnect.disabled = true;
  btnStop.disabled = false;
  running = true;

  const decoder = new TextDecoder();
  while (running) {
    try {
      const res = await device.transferIn(cdc.endpointIn, 64);
      if (res.data && res.data.byteLength > 0) {
        const text = decoder.decode(res.data);
        logText += text;
        if (logText.length > 20000) logText = logText.slice(-20000);   // the report repeats; keep the last few
        rawEl.textContent = logText;
        rawEl.scrollTop = rawEl.scrollHeight;

        for (const ln of splitLines(text)) {
          checker.feed(ln);
        }
        updateUI();
      }
    } catch (err) {
      if (running) {
        statusEl.textContent = `Transfer error: ${err.message}`;
        statusEl.className = 'bad';
      }
      break;
    }
  }
}

btnConnect.addEventListener('click', async () => {
  try {
    const dev = await navigator.usb.requestDevice({ filters: FILTERS });
    await start(dev);
  } catch (err) {
    statusEl.textContent = `Connection failed: ${err.message}`;
    statusEl.className = 'bad';
  }
});

btnStop.addEventListener('click', async () => {
  running = false;
  if (device) {
    try { await device.close(); } catch (_) {}
    device = null;
  }
  statusEl.textContent = 'Disconnected.';
  statusEl.className = '';
  btnConnect.disabled = false;
  btnStop.disabled = true;
});

btnCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(logText).then(() => {
    btnCopy.textContent = 'Copied!';
    setTimeout(() => { btnCopy.textContent = 'Copy'; }, 1500);
  });
});
</script>
