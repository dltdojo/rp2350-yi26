[package]
name = "exp101-blink"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal LED blink for the Raspberry Pi Pico 2 (RP2350), used to build the prebuilt blink.uf2 shipped with exp101-board-bringup"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
# Provides the RP2350 memory layout and boot ROM image-definition block, so the
# resulting ELF is directly bootable without a hand-written memory.x.
rp2350-linker = "0.2.3"

# Embassy — pinned to a version set verified on RP2350 hardware.
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
