[package]
name = "exp109-hardware-trng"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Getting real entropy out of the RP2350's TRNG, and why the driver default does not"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
# `rp235xa` selects the 30-GPIO RP2350A package used by the official Pico 2.
# A board built on the 48-GPIO RP2350B needs `rp235xb` here instead.
#
# It also gates the TRNG: `embassy-rp` compiles its `trng` module only under
# `_rp235x`, which both package features imply. There is no TRNG on the
# RP2040, so this is the first firmware here that could not be back-ported.
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

# Random bytes have no physical form. The log is the only way to see them.
usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }

[features]
# Auto-reboot is ON by default, so the flash-edit-flash loop stays a software
# loop. Build a firmware that ignores the 1200-baud touch with:
#
#   cargo build --release --no-default-features
#
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

# Use embassy-rp's default sample_count of 25 instead of the value measured
# here. Not a bug to reproduce — an experiment to run; see the README.
#
#   cargo build --release --features upstream-default
#
upstream-default = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
