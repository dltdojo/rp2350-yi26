[package]
name = "exp159-a-key-that-was-never-in-flash"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A P-256 key generated on the board into an SRAM bank Non-secure code cannot read, used to sign a fresh challenge, verified off the board"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }
breadcrumb = { path = "../../crates/breadcrumb" }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
