[package]
name = "exp166-whose-firmware-will-it-accept"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A board that refuses a firmware image it was not handed a valid signature for"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.1"
static_cell = "2.1.1"

p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }
framing = { path = "../../crates/framing" }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
