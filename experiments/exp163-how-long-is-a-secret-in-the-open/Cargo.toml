[package]
name = "exp163-how-long-is-a-secret-in-the-open"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A Non-secure core watching the SRAM while a Secure core signs, and what wiping afterwards does and does not buy"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

# Same build as exp160, deliberately: this experiment measures what that one
# leaves behind, and a different feature set would measure a different program.
# `zeroize` stays off for the same reason it is off there, and exp160's C2a
# measured what turning it on would and would not have bought.
ml-dsa = { version = "0.1.1", default-features = false }
hybrid-array = { version = "0.4", default-features = false }

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }
breadcrumb = { path = "../../crates/breadcrumb" }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
