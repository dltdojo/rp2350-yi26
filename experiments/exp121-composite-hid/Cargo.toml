[package]
name = "exp121-composite-hid"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "One cable, two functions: a HID keyboard beside the CDC log, and what that does to every number in the descriptors"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-usb = "0.6.0"
usbd-hid = "0.10.0"
static_cell = "2.1.1"

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

# Build the HID function before the CDC pair instead of after.
#
# Same descriptors, same firmware, one line moved — and every interface and
# endpoint number changes. This is the experiment's second half: the numbers
# are stable only because somebody decided the order, and code that remembered
# them last time is now writing to the wrong endpoint.
#
#   cargo build --release --features hid-first
#
hid-first = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
