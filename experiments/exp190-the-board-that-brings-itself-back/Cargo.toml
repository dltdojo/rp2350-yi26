[package]
name = "exp190-the-board-that-brings-itself-back"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A firmware killed four ways, which brings itself back every time and hands itself to the bootloader when it cannot"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "unstable-pac"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }
breadcrumb = { path = "../../crates/breadcrumb" }
lifeline = { path = "../../crates/lifeline" }

[features]
default = ["auto-reboot"]
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
