[package]
name = "exp132-one-owner-or-two"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "One interface with one owner, or two with two: the same draw commanded two ways, and what each costs"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
rp2350-linker = "0.2.3"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-usb = "0.6.0"
static_cell = "2.1.1"

draw = { path = "../../crates/draw" }
entropy-health = { path = "../../crates/entropy-health" }
usb-log = { path = "../../crates/usb-log" }
usb-reboot = { path = "../../crates/usb-reboot", default-features = false }

[features]
default = ["auto-reboot"]

# The second build. Commands move to a vendor interface so the log and the
# console can have different owners at the same time — exp122's arrangement,
# applied to a device that has a job.
two-channels = []
auto-reboot = ["usb-reboot/auto-reboot"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[workspace]
